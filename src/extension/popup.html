<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Affine Tango</title>
<style>
:root{
  --card:#F1F5FB;
  --card-edge:#DCE6F5;
  --ground:#FFFFFF;
  --ink:#12172A;
  --ink-soft:#47536A;
  --ink-faint:#8793A8;
  --pin:#1D4ED8;
  --pivot:#D97706;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --card:#2A2C30;
    --card-edge:#3D4046;
    --ground:#1E1F22;
    --ink:#F2F4F8;
    --ink-soft:#B7BEC9;
    --ink-faint:#7C8390;
    --pin:#4C7DFF;
    --pivot:#D97706;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  width:260px;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  padding:16px;
}
h1{
  font-family:var(--mono);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.28em;margin:0 0 12px;
}
.status{
  background:var(--card);border:1px solid var(--card-edge);border-radius:2px;
  padding:10px 12px;margin-bottom:12px;
}
.status .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;padding:2px 0}
.status .row .k{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.1em}
.status .msg{color:var(--ink-soft);font-family:var(--sans);font-size:12px;line-height:1.4}
button{
  width:100%;
  font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  background:var(--card);color:var(--ink);
  border:1px solid var(--card-edge);border-bottom-width:2px;border-radius:2px;
  padding:9px 11px;cursor:pointer;margin-bottom:8px;
}
button:hover{background:#E3ECFA}
button:active{border-bottom-width:1px;transform:translateY(1px)}
button[disabled]{opacity:.4;cursor:default}
button.primary{background:var(--pin);color:#fff;border-color:var(--pin)}
button.primary:hover{background:#1840B0}
#autoStatus{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:center;min-height:14px;margin-top:2px}
</style>
</head>
<body>
<h1>Affine Tango</h1>
<div class="status" id="status">
  <div class="msg">Checking the active tab&hellip;</div>
</div>
<button id="watchBtn" disabled>Watch the math</button>
<button id="autoBtn" class="primary" disabled>Auto-solve</button>
<div id="autoStatus"></div>
<script src="popup.js"></script>
</body>
</html>
